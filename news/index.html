<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="ja" lang="ja">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=shift_jis" />
<title>THE GTS JOURNAL</title>
<script type="text/javascript" src="js/swfobject.js"></script>
<script type="text/javascript" src="js/swfmacmousewheel2.js"></script>
<style type="text/css"> <!-- body { margin: 0; padding: 0; } --> </style>
</head>
<body bgcolor="#000000">
  <div id="flashcontent" />
</body>
<script type="text/javascript">
var vars = {};
var query = window.location.search.substring(1);
var parms = query.split('&');
for (var i=0; i<parms.length; i++)
{
  var pos = parms[i].indexOf('=');
  if (pos > 0) 
  {
    var key = parms[i].substring(0,pos);
    var val = parms[i].substring(pos+1);
    vars[key] = val;
    //so.addVariable(key, val);
  }
}
var params = { scale:'noScale', salign:'lt', menu:'false' ,wmode:'windows'};
var attributes = { id:'viewer_loader', name:'viewer_loader' }; // give an id to the flash object
swfobject.embedSWF("viewer_loader.swf", "flashcontent", "100%", "100%", "9.0.124", "js/express.swf", vars, params, attributes );
if (swfmacmousewheel) swfmacmousewheel.registerObject(attributes.id);
</script>
</html>
